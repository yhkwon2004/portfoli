name: Deploy cinematic portfolio to Pages

on:
  push:
    branches: ["claude/relaxed-hypatia-9d1z3t"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build and check cinematic portfolio
        # Native ES modules and relative URLs also work below the /portfoli/ base path.
        working-directory: public/cinematic
        run: |
          node build.mjs
          node check.mjs
      - name: Disable Jekyll
        run: touch public/cinematic/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/cinematic

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
