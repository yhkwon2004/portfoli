name: Deploy cinematic portfolio manually

# Kept for existing manual entry points; it publishes the same site as nextjs.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build and check cinematic portfolio
        working-directory: public/cinematic
        run: |
          node build.mjs
          node check.mjs
      - name: Disable Jekyll
        run: touch public/cinematic/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/cinematic

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
